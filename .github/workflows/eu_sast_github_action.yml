name: "HCL AppScan SAST for ASoC Instance"
on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Run AppScan SAST scan
        uses: HCL-TECH-SOFTWARE/appscan-sast-action@Issue_Fix_Main_Wait_For_Analysis_False
        with:
          asoc_key: ${{secrets.ASOC_KEY}}
          asoc_secret: ${{secrets.ASOC_SECRET}}
          application_id: 1dd70de0-f756-4cd4-bad3-8354731ceff4
          static_analysis_only: true
          service_url: https://blmycldtl446131.nonprod.hclpnp.com
