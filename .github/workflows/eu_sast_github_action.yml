name: "HCL AppScan SAST"
on:
  workflow_dispatch:

  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write
env:
  SCAN_NAME: Update_Name_Scan_Update

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run AppScan SAST scan
        uses: HCL-TECH-SOFTWARE/appscan-sast-action@PRB_0181241_Bug_Fixes
        with:
          asoc_key: ${{secrets.ASOC_KEY}}
          asoc_secret: ${{secrets.ASOC_SECRET}}
          application_id: b2ec76ec-a0a3-468f-a80b-f1b2a0c2c1fb
          service_url: https://cloud.appscan.com
          wait_for_analysis: true
          scan_name: ${{ env.SCAN_NAME }}
          sca_scan_id: 505cbece-d4a5-41c3-bff3-401b06034317
