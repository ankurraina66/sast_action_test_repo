name: "HCL AppScan SAST for ASoC EU Instance"
on:
  workflow_dispatch:

  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  scan:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Run AppScan SAST scan
        uses: HCL-TECH-SOFTWARE/appscan-sast-action@Test_ASPL_2090
        with:
          asoc_key: ${{secrets.ASOC_KEY}}
          asoc_secret: ${{secrets.ASOC_SECRET}}
          application_id: 1dd70de0-f756-4cd4-bad3-8354731ceff4
          service_url: ${{secrets.SERVICE_URL}}
          acceptssl: true
          wait_for_analysis: false
          static_analysis_only: true
