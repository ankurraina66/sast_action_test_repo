name: "HCL AppScan SAST"

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  scan:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check runner Node.js version
        shell: bash
        run: |
          echo "Node.js version available on PATH:"
          node --version

          echo "Node.js executable on PATH:"
          which node

          echo "Runner operating system:"
          uname -a

          echo "Runner name:"
          echo "${RUNNER_NAME:-unknown}"

      - name: Run AppScan SAST scan
        uses: HCL-TECH-SOFTWARE/appscan-sast-action@test/cve-2026-111497
        with:
          asoc_key: ab3f2a5f-00f6-21a5-30ee-853650a51b8e
          asoc_secret: Ieuy2iZ0tkwrslDmBEMPCWtXmIuJyZu2T07KRVjbx+Zp
          application_id: a892fce6-630b-44b4-8f47-d6f6f7d63be5
