name: "HCL AppScan SAST"
on:
  workflow_dispatch:

  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run AppScan SAST scan
        uses: HCL-TECH-SOFTWARE/appscan-sast-action@PRB_0181241_Bug_Fixes
        with:
          asoc_key: ${{secrets.ASOC_KEY}}
          asoc_secret: ${{secrets.ASOC_SECRET}}
          application_id: b2ec76ec-a0a3-468f-a80b-f1b2a0c2c1fb
          service_url: https://cloud.appscan.com
          static_analysis_only: true
          wait_for_analysis: true
          scan_name: new_scan_name_231126
          sast_scan_id: ab7b61ed-c190-48cd-8559-932fdfdf43e4
