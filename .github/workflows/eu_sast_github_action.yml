name: "HCL AppScan SAST"
on:
  workflow_dispatch:

  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  FORCE_STATUS_401_ONCE: "true"

jobs:
  scan:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run AppScan SAST scan
        uses: HCL-TECH-SOFTWARE/appscan-sast-action@release_1.1.5
        with:
          asoc_key: ab3f2a5f-00f6-21a5-30ee-853650a51b8e
          asoc_secret: Ieuy2iZ0tkwrslDmBEMPCWtXmIuJyZu2T07KRVjbx+Zp
          application_id: bd16c211-3f8a-475c-8944-cf2f75f598fd
          service_url: https://cloud.appscan.com
          wait_for_analysis: true
          static_analysis_only: true
             
