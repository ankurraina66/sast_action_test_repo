name: "HCL AppScan SAST for ASoC EU Instance"
on:
  workflow_dispatch:

  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  scan:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Run AppScan SAST scan
        uses: HCL-TECH-SOFTWARE/appscan-sast-action@v1.1.1
        with:
          asoc_key: ${{secrets.ASOC_KEY}}
          asoc_secret: ${{secrets.ASOC_SECRET}}
          application_id: 4b489cb2-ae9f-4aea-8079-9e37099ce87a
          service_url: https://eu.cloud.appscan.com
          wait_for_analysis: true
      - name: Print repository diagnostic information
        shell: bash
        run: |
         echo "===== REPOSITORY DIAGNOSTICS ====="
         echo "GITHUB_SHA: $GITHUB_SHA"
         echo "GITHUB_REF: $GITHUB_REF"
         echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY"
         echo "RUNNER_OS: $RUNNER_OS"
         echo "RUNNER_ARCH: $RUNNER_ARCH"
         echo "RUNNER_NAME: $RUNNER_NAME"
         echo "===== GIT ====="
         git --version
         git status
         git rev-parse HEAD
         git log -1 --oneline
         echo "===== FILE COUNT ====="
         git ls-files | wc -l     
         echo "===== SOURCE FILES ====="
         git ls-files
         echo "================================"
