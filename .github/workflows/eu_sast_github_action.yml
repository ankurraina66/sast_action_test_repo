name: "HCL AppScan SAST"
on:
  workflow_dispatch:

  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  SCAN_NAME: New_Scan_Name_Update

jobs:
  scan:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run AppScan SAST scan
        uses: HCL-TECH-SOFTWARE/appscan-sast-action@PRB_0181241_Bug_Fixes
        with:
          asoc_key: ab3f2a5f-00f6-21a5-30ee-853650a51b8e
          asoc_secret: Ieuy2iZ0tkwrslDmBEMPCWtXmIuJyZu2T07KRVjbx+Zp
          application_id: b2ec76ec-a0a3-468f-a80b-f1b2a0c2c1fb
          service_url: https://cloud.appscan.com
          wait_for_analysis: true
          static_analysis_only: true
          scan_name: ${{ env.SCAN_NAME }}
          sast_scan_id: 09b19fc6-2087-4fba-8b29-a700f819f39e
            
